[pytest]
testpaths = tests/unit tests/integration tests/security
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = tests/e2e .git .pytest_cache
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
